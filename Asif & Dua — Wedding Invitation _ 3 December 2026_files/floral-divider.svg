<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 80" width="100%" height="100%">
  <defs>
    <linearGradient id="dividerGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B38A50" stop-opacity="0"/>
      <stop offset="25%" stop-color="#ECC880"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="75%" stop-color="#ECC880"/>
      <stop offset="100%" stop-color="#B38A50" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="divRose" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#A7334F"/>
      <stop offset="55%" stop-color="#6F2638"/>
      <stop offset="100%" stop-color="#3A111C"/>
    </radialGradient>
  </defs>

  <!-- Left Line Fade-in -->
  <line x1="20" y1="40" x2="230" y2="40" stroke="url(#dividerGold)" stroke-width="1.2"/>
  <line x1="80" y1="44" x2="210" y2="44" stroke="url(#dividerGold)" stroke-width="0.7" stroke-dasharray="2,3" opacity="0.7"/>

  <!-- Right Line Fade-out -->
  <line x1="370" y1="40" x2="580" y2="40" stroke="url(#dividerGold)" stroke-width="1.2"/>
  <line x1="390" y1="44" x2="520" y2="44" stroke="url(#dividerGold)" stroke-width="0.7" stroke-dasharray="2,3" opacity="0.7"/>

  <!-- Left Filigree Scrollwork -->
  <g fill="none" stroke="#B38A50" stroke-width="1.4" stroke-linecap="round">
    <path d="M 230,40 C 250,40 262,28 274,32 C 282,34 286,40 280,44 C 274,48 268,42 272,36"/>
    <circle cx="230" cy="40" r="2.5" fill="#D4AF37"/>
    <circle cx="264" cy="30" r="2" fill="#D4AF37"/>
  </g>

  <!-- Right Filigree Scrollwork (Mirrored) -->
  <g fill="none" stroke="#B38A50" stroke-width="1.4" stroke-linecap="round">
    <path d="M 370,40 C 350,40 338,28 326,32 C 318,34 314,40 320,44 C 326,48 332,42 328,36"/>
    <circle cx="370" cy="40" r="2.5" fill="#D4AF37"/>
    <circle cx="336" cy="30" r="2" fill="#D4AF37"/>
  </g>

  <!-- Center Botanical Flower & Diamonds -->
  <!-- Burgundy Rose Centerpiece -->
  <g transform="translate(300, 40)">
    <circle cx="0" cy="0" r="14" fill="url(#divRose)"/>
    <path d="M -7,-5 C -4,-11 4,-11 7,-5 C 12,-1 10,7 4,10 C -2,12 -8,10 -10,4 C -12,0 -9,-3 -7,-5 Z" fill="#9E324E" opacity="0.8"/>
    <circle cx="0" cy="0" r="4.5" fill="#EAD7C5"/>
    <circle cx="0" cy="0" r="2.5" fill="#D4AF37"/>

    <!-- Small Surrounding Petals/Leaves -->
    <path d="M 0,-14 C 2,-18 0,-21 0,-21 C 0,-21 -2,-18 0,-14 Z" fill="#D4AF37"/>
    <path d="M 0,14 C 2,18 0,21 0,21 C 0,21 -2,18 0,14 Z" fill="#D4AF37"/>
    <circle cx="-18" cy="0" r="2.5" fill="#D4AF37"/>
    <circle cx="18" cy="0" r="2.5" fill="#D4AF37"/>
  </g>
</svg>