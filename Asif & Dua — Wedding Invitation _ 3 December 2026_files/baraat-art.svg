<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECC880"/>
      <stop offset="50%" stop-color="#B38A50"/>
      <stop offset="100%" stop-color="#6F491A"/>
    </linearGradient>
  </defs>
  <!-- Royal Wedding Archway & Floral Swags -->
  <g stroke="url(#bGold)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Arch -->
    <path d="M 28,145 L 28,68 C 28,32 50,20 80,20 C 110,20 132,32 132,68 L 132,145" stroke-width="2.5"/>
    <path d="M 38,145 L 38,72 C 38,42 56,30 80,30 C 104,30 122,42 122,72 L 122,145" stroke-width="1.2" stroke-dasharray="3,3"/>
    
    <!-- Base Pillars -->
    <rect x="22" y="140" width="12" height="6" fill="#6F2638" stroke="url(#bGold)" stroke-width="1.2"/>
    <rect x="126" y="140" width="12" height="6" fill="#6F2638" stroke="url(#bGold)" stroke-width="1.2"/>
    
    <!-- Arch Keystone & Crest -->
    <path d="M 80,12 L 85,20 L 75,20 Z" fill="#ECC880"/>
    <circle cx="80" cy="8" r="3" fill="#6F2638" stroke="url(#bGold)" stroke-width="1"/>

    <!-- Floral Garland Hanging across Arch -->
    <path d="M 34,70 Q 56,90 80,90 Q 104,90 126,70" stroke-width="1.8"/>
    <path d="M 44,55 Q 62,75 80,75 Q 98,75 116,55" stroke-width="1.2"/>

    <!-- Hanging Floral Bells & Droplets -->
    <circle cx="80" cy="98" r="3" fill="#6F2638"/>
    <circle cx="62" cy="94" r="2.5" fill="#ECC880"/>
    <circle cx="98" cy="94" r="2.5" fill="#ECC880"/>
    <circle cx="50" cy="82" r="2" fill="#6F2638"/>
    <circle cx="110" cy="82" r="2" fill="#6F2638"/>
  </g>
</svg>