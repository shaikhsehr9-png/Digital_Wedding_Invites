<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Organic wax lighting & gradients -->
    <radialGradient id="waxBase" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#9E324E"/>
      <stop offset="45%" stop-color="#6F2638"/>
      <stop offset="85%" stop-color="#421522"/>
      <stop offset="100%" stop-color="#2A0B14"/>
    </radialGradient>
    
    <radialGradient id="waxHighlight" cx="30%" cy="25%" r="40%">
      <stop offset="0%" stop-color="#DE6E86" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#9E324E" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6F2638" stop-opacity="0"/>
    </radialGradient>
    
    <linearGradient id="goldSeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEAA7"/>
      <stop offset="35%" stop-color="#ECC880"/>
      <stop offset="65%" stop-color="#B38A50"/>
      <stop offset="100%" stop-color="#6B4F23"/>
    </linearGradient>

    <filter id="sealShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="3" dy="8" stdDeviation="6" flood-color="#15050A" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#FFE5A3" flood-opacity="0.2"/>
    </filter>
    
    <filter id="embossInner">
      <feOffset dx="1" dy="1"/>
      <feGaussianBlur stdDeviation="0.8" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="#000" flood-opacity="0.7" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>
  </defs>

  <!-- Wax Outer Organic Droplet Contour -->
  <path d="M 100,12 
           C 125,10 145,18 162,32 
           C 180,48 190,70 188,95 
           C 186,118 192,138 180,158 
           C 168,178 145,188 122,190 
           C 98,192 80,186 60,188 
           C 38,189 20,172 12,150 
           C 4,128 8,108 10,88 
           C 12,65 24,42 42,26 
           C 60,12 78,14 100,12 Z" 
        fill="url(#waxBase)" 
        filter="url(#sealShadow)"/>

  <!-- Wax Surface Sheen -->
  <path d="M 100,12 
           C 125,10 145,18 162,32 
           C 180,48 190,70 188,95 
           C 186,118 192,138 180,158 
           C 168,178 145,188 122,190 
           C 98,192 80,186 60,188 
           C 38,189 20,172 12,150 
           C 4,128 8,108 10,88 
           C 12,65 24,42 42,26 
           C 60,12 78,14 100,12 Z" 
        fill="url(#waxHighlight)"/>

  <!-- Inner Recessed Impression Plate -->
  <circle cx="100" cy="100" r="68" fill="#4B1624" stroke="url(#goldSeal)" stroke-width="2" stroke-opacity="0.6"/>
  <circle cx="100" cy="100" r="63" fill="none" stroke="url(#goldSeal)" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.85"/>

  <!-- Decorative Laurel / Filigree Ring -->
  <g fill="url(#goldSeal)" opacity="0.9" transform="scale(0.88) translate(13, 13)">
    <!-- Top Floral Crown Motif -->
    <path d="M 97,42 C 98,39 100,37 100,37 C 100,37 102,39 103,42 C 102,44 100,45 100,45 C 100,45 98,44 97,42 Z"/>
    <path d="M 91,44 C 93,42 96,42 97,43 C 96,45 94,47 92,47 C 91,46 90,45 91,44 Z"/>
    <path d="M 109,44 C 107,42 104,42 103,43 C 104,45 106,47 108,47 C 109,46 110,45 109,44 Z"/>

    <!-- Bottom Botanical Sprig -->
    <path d="M 96,158 C 98,155 100,154 100,154 C 100,154 102,155 104,158 C 102,160 100,161 100,161 C 100,161 98,160 96,158 Z"/>
    <circle cx="92" cy="155" r="2"/>
    <circle cx="108" cy="155" r="2"/>
    <circle cx="100" cy="150" r="2.5"/>
  </g>

  <!-- Intertwined Monogram A & D -->
  <g fill="url(#goldSeal)" filter="drop-shadow(1px 2px 2px rgba(0,0,0,0.6))" text-anchor="middle">
    <!-- Calligraphic First A -->
    <text x="80" y="116" font-family="'Great Vibes', 'Brush Script MT', cursive" font-size="54" font-weight="bold" letter-spacing="1">A</text>
    
    <!-- Elegant Ampersand -->
    <text x="100" y="103" font-family="'Cormorant Garamond', serif" font-size="28" font-style="italic" opacity="0.95">&amp;</text>
    
    <!-- Calligraphic Second D -->
    <text x="120" y="116" font-family="'Great Vibes', 'Brush Script MT', cursive" font-size="54" font-weight="bold" letter-spacing="1">D</text>
  </g>

  <!-- Tiny Gold Flecks in Wax -->
  <circle cx="58" cy="52" r="1.2" fill="#FFEAA7" opacity="0.7"/>
  <circle cx="145" cy="62" r="1.5" fill="#FFEAA7" opacity="0.6"/>
  <circle cx="152" cy="138" r="1" fill="#FFEAA7" opacity="0.8"/>
  <circle cx="48" cy="135" r="1.3" fill="#FFEAA7" opacity="0.75"/>
</svg>