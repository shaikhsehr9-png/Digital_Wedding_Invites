<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="goldFiligree" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE5B5"/>
      <stop offset="40%" stop-color="#D4AF37"/>
      <stop offset="75%" stop-color="#B38A50"/>
      <stop offset="100%" stop-color="#805B24"/>
    </linearGradient>

    <radialGradient id="roseBurgundy" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#A7334F"/>
      <stop offset="50%" stop-color="#6F2638"/>
      <stop offset="90%" stop-color="#421522"/>
      <stop offset="100%" stop-color="#2D0B14"/>
    </radialGradient>

    <radialGradient id="rosePetalSoft" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#C7526E"/>
      <stop offset="60%" stop-color="#8B263E"/>
      <stop offset="100%" stop-color="#541323"/>
    </radialGradient>

    <radialGradient id="roseChampagne" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFF8EE"/>
      <stop offset="50%" stop-color="#F2DFCA"/>
      <stop offset="85%" stop-color="#D9BC9E"/>
      <stop offset="100%" stop-color="#B38A50"/>
    </radialGradient>
  </defs>

  <!-- Ornate Corner Vine Flourishes -->
  <g fill="none" stroke="url(#goldFiligree)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Corner Border Guide Curves -->
    <path d="M 6,180 C 10,80 80,10 180,6" stroke-width="1.5" opacity="0.4"/>
    <path d="M 14,150 C 20,70 70,20 150,14" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.6"/>

    <!-- Main Graceful Spiral Tendrils -->
    <path d="M 6,220 C 15,140 45,90 100,50 C 135,25 185,15 228,8" stroke-width="2.2"/>
    <path d="M 35,175 C 60,110 110,60 175,35" stroke-width="1.2"/>
    
    <!-- Delicate Filigree Loops -->
    <path d="M 120,40 C 135,20 160,25 155,45 C 150,60 130,55 125,70" stroke-width="1.2"/>
    <path d="M 40,120 C 20,135 25,160 45,155 C 60,150 55,130 70,125" stroke-width="1.2"/>
    <path d="M 180,18 C 195,8 215,15 210,32 C 205,45 190,40 185,55" stroke-width="1"/>
    <path d="M 18,180 C 8,195 15,215 32,210 C 45,205 40,190 55,185" stroke-width="1"/>
  </g>

  <!-- Golden Botanical Leaves -->
  <g fill="url(#goldFiligree)" opacity="0.85">
    <!-- Leaves along top vine -->
    <path d="M 145,26 C 155,18 168,22 172,30 C 166,35 152,34 145,26 Z"/>
    <path d="M 188,14 C 196,6 206,10 208,18 C 202,22 192,20 188,14 Z"/>
    <path d="M 110,52 C 118,44 130,48 132,58 C 124,60 115,58 110,52 Z"/>
    
    <!-- Leaves along left vine -->
    <path d="M 26,145 C 18,155 22,168 30,172 C 35,166 34,152 26,145 Z"/>
    <path d="M 14,188 C 6,196 10,206 18,208 C 22,202 20,192 14,188 Z"/>
    <path d="M 52,110 C 44,118 48,130 58,132 C 60,124 58,115 52,110 Z"/>

    <!-- Small leaf buds -->
    <circle cx="218" cy="10" r="2.5"/>
    <circle cx="10" cy="218" r="2.5"/>
    <circle cx="85" cy="85" r="2"/>
    <circle cx="160" cy="48" r="2"/>
    <circle cx="48" cy="160" r="2"/>
  </g>

  <!-- Champagne Secondary Blossom (Upper Right) -->
  <g transform="translate(145, 52) scale(0.65)">
    <circle cx="0" cy="0" r="22" fill="url(#roseChampagne)"/>
    <path d="M -12,-8 C -8,-20 8,-20 12,-8 C 20,-4 20,10 10,16 C 0,22 -14,18 -18,8 C -22,-2 -16,-6 -12,-8 Z" fill="url(#goldFiligree)" opacity="0.4"/>
    <circle cx="0" cy="0" r="10" fill="#EAD7C5"/>
    <circle cx="0" cy="0" r="4" fill="#B38A50"/>
  </g>

  <!-- Champagne Secondary Blossom (Lower Left) -->
  <g transform="translate(52, 145) scale(0.65)">
    <circle cx="0" cy="0" r="22" fill="url(#roseChampagne)"/>
    <path d="M -12,-8 C -8,-20 8,-20 12,-8 C 20,-4 20,10 10,16 C 0,22 -14,18 -18,8 C -22,-2 -16,-6 -12,-8 Z" fill="url(#goldFiligree)" opacity="0.4"/>
    <circle cx="0" cy="0" r="10" fill="#EAD7C5"/>
    <circle cx="0" cy="0" r="4" fill="#B38A50"/>
  </g>

  <!-- Large Luxury Burgundy Rose (Central Hero) -->
  <g transform="translate(82, 82)">
    <!-- Shadow behind rose -->
    <circle cx="3" cy="5" r="42" fill="#20060C" opacity="0.35" filter="blur(4px)"/>

    <!-- Outer Petals Layer -->
    <path d="M -38,-15 C -45,15 -25,40 5,42 C 30,44 48,22 44,-8 C 40,-35 15,-46 -15,-40 C -32,-35 -40,-25 -38,-15 Z" fill="url(#roseBurgundy)"/>
    
    <!-- Intermediate Petals -->
    <path d="M -28,-10 C -35,10 -18,32 6,32 C 26,32 36,16 32,-6 C 28,-26 8,-34 -12,-30 C -24,-26 -30,-18 -28,-10 Z" fill="url(#rosePetalSoft)"/>
    
    <!-- Cupped Petals -->
    <path d="M -20,12 C -8,28 18,26 24,10 C 30,-5 20,-22 0,-24 C -18,-25 -26,-5 -20,12 Z" fill="url(#roseBurgundy)"/>
    <path d="M -14,-5 C -18,8 -6,18 8,16 C 18,14 20,2 14,-8 C 8,-16 -4,-16 -14,-5 Z" fill="url(#rosePetalSoft)"/>

    <!-- Center Rose Swirl & Gold Pollen -->
    <path d="M -5,-3 C -2,6 8,5 6,-2 C 4,-7 -4,-6 -5,-3 Z" fill="#421522"/>
    <circle cx="-1" cy="-1" r="2.5" fill="#FFEAA7" opacity="0.9"/>
    <circle cx="3" cy="2" r="1.5" fill="#FFEAA7" opacity="0.8"/>
    <circle cx="-4" cy="2" r="1.2" fill="#FFEAA7" opacity="0.8"/>

    <!-- Gold Accent Edges on Petals -->
    <path d="M -32,5 C -24,25 0,35 22,25" fill="none" stroke="url(#goldFiligree)" stroke-width="1.2" opacity="0.55"/>
    <path d="M -15,-32 C 10,-35 30,-20 32,-2" fill="none" stroke="url(#goldFiligree)" stroke-width="1.2" opacity="0.55"/>
  </g>
</svg>